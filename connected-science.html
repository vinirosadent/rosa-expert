<style>
/* ============================================================
   Connected Science — page-scoped styles (prefix cs-)
   Everything structural comes from tokens.css / components.css.
   Only two atmospheres exist on this page and the background
   changes exactly once: warm ivory for the opening chapter,
   cool slate for "Work built together". No zebra.
   ============================================================ */

/* The ivory is the SAME value the approved premise section uses on the
   home page (--premise-ivory #FDF6EE); reusing it is what makes this page
   read as part of the site rather than as a second warm palette. */
.cs-warm { --cs-ivory:#FDF6EE; background: var(--cs-ivory); }
.cs-cool { background: var(--slate-50); }

.cs-eyebrow { letter-spacing: .2em; }

/* ── Chapter 1 — one continuous warm field ───────────────── */
/* overflow:hidden is load-bearing: the ripple field is deliberately wider
   than the viewport on the right, and without the clip every phone would
   scroll sideways. */
.cs-opening { position: relative; overflow: hidden; }

/* ── Hero ─────────────────────────────────────────────────
   Not a full screen. The height is capped so that at 1440x900 the top of
   "The wider lab" is already on screen — the visitor must not scroll and
   find only another big title. */
.cs-hero {
  position: relative;
  min-height: clamp(440px, 60vh, 600px);
  display: flex; align-items: center;
  padding-top: var(--space-10); padding-bottom: var(--space-10);
}
.cs-hero-inner {
  position: relative; z-index: 2;
  width: 100%; max-width: var(--container-base); margin: 0 auto;
  padding: 0 var(--gutter);
  display: grid; grid-template-columns: minmax(0, 40%) minmax(0, 60%);
  align-items: center; gap: var(--space-8);
}
.cs-hero-copy { max-width: 30rem; }
.cs-hero h1 {
  font-family: var(--font-serif); font-weight: var(--weight-medium);
  font-size: var(--fs-page-title);       /* shared ramp — same H1 size as Who / To read / News */
  line-height: 1.02; letter-spacing: var(--tracking-tight);
  color: var(--text-strong); margin: 14px 0 0;
}
.cs-hero-lede {
  margin-top: 18px; font-size: clamp(1rem, .93rem + .35vw, 1.2rem);
  line-height: 1.6; color: var(--text-body); max-width: 34ch;
}

/* ── The hero field ──────────────────────────────────────
   A particle ocean at a shallow angle, rendered by
   assets/js/cs-wave-field.js. An invisible impact lands on it and a
   damped wave packet travels outward; the dots ARE the wave — they
   only rise and fall, the wave is what travels. Nothing here is a
   drawn circle, and the projection (not a thicker foreground stroke)
   is what makes the near ripple read more strongly than the far one.

   The field runs behind the copy and dies out before it. That guard
   lives in the renderer's per-particle alpha, not in a mask, so
   there is never a hard edge between text and art. */
.cs-wave-field {
  position: absolute; top: 50%; left: 0; right: -12%;
  /* 106%, not 128%: the field must die just below the hero's own edge.
     At 128% the dots ran on behind "The wider lab" and the next section
     read as sitting ON the animation instead of after it. */
  height: 106%;
  transform: translateY(calc(-50% + var(--cs-shift, 0px)));
  opacity: var(--cs-fade, 1);
  z-index: 0; pointer-events: none;
  overflow: hidden;

  /* Fallback wash, and the atmosphere underneath the particles: four
     soft lobes as plain CSS gradients — no filter, no blur, no extra
     DOM. With JavaScript off this is all that remains, which is a
     quiet warm hero rather than an empty one. */
  background-image:
    radial-gradient(58% 52% at 76% 36%, rgba(201,174,142,.13), rgba(201,174,142,0) 70%),
    radial-gradient(52% 46% at 47% 74%, rgba(126,154,180,.07),  rgba(126,154,180,0) 70%),
    radial-gradient(46% 54% at 93% 64%, rgba(0,61,124,.055),    rgba(0,61,124,0)    70%),
    radial-gradient(38% 34% at 86% 18%, rgba(239,124,0,.07),    rgba(239,124,0,0)   70%);
}
.cs-wave-canvas { display: block; width: 100%; height: 100%; }

/* ── The wider lab ───────────────────────────────────────
   Deliberately NOT a second hero: no extra top padding beyond the section
   rhythm, and the H2 is one step down the shared heading ramp. */
.cs-wider {
  max-width: var(--container-base); margin: 0 auto;
  /* space-12, not space-4: the eyebrow was sitting almost on the field's
     lower edge and the whole block read as cramped against the art. */
  padding: var(--space-12) var(--gutter) 0;
  position: relative; z-index: 2;
}
.cs-wider-grid { display: grid; grid-template-columns: minmax(0, 34%) minmax(0, 66%); gap: var(--space-10); align-items: end; }
.cs-wider h2 {
  font-family: var(--font-serif); font-weight: var(--weight-medium);
  font-size: var(--fs-section-title); line-height: 1.06;
  letter-spacing: var(--tracking-tight); color: var(--text-strong); margin-top: 12px;
}
.cs-wider-lede { font-size: clamp(1.05rem, .95rem + .5vw, 1.35rem); line-height: 1.5; color: var(--text-body); max-width: 40ch; }

/* ── Exchange · Collaborations ───────────────────────────
   Two full-width chapters, stacked — identical treatment, so neither
   reads as the main one. Each opens with title + lead on the left and
   gives the whole container width to its institutions, which is what
   lets real logos breathe instead of fighting inside half a column. */
.cs-modes {
  max-width: var(--container-base); margin: var(--space-16) auto 0;
  /* space-8, not space-20: that padding used to lead into Chapter 2's
     atmosphere shift. With Stories held back for launch, Collaborations
     now runs straight into the shared footer (its own space-12 margin-top
     is untouched — global, not this page's to change), and space-20 read
     as 168px of dead ivory air above it. */
  padding: 0 var(--gutter) var(--space-8);
  position: relative; z-index: 2;
}
.cs-mode { padding: var(--space-12) 0 var(--space-10); min-width: 0; }
.cs-mode + .cs-mode { border-top: 1px solid var(--border-subtle); }
/* max-content, not a 30% column: "Exchange" is a 127px glyph run sitting in
   a 316px cell, which put 189px of dead air in front of the declared 40px
   gap — 229px of visual space before the lede even starts. A short word
   only needs its own width; the gap is what separates it from the lede. */
.cs-mode-head { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: var(--space-8); align-items: start; }
.cs-mode h3 {
  font-family: var(--font-serif); font-weight: var(--weight-medium);
  font-size: clamp(1.45rem, 1.05rem + 1.1vw, 1.95rem); line-height: 1.1;
  letter-spacing: var(--tracking-tight); color: var(--text-strong); margin: 0;
}
.cs-mode-lead { font-size: 16px; line-height: 1.6; color: var(--text-muted); max-width: 56ch; }

/* Institutions: a calm, centred wall across the full width, run over a
   quiet copy of the hero's wave field. The crest sits in a fixed-height
   stage (each mark's optical height is precomputed in the data — see
   band() below — object-fit: contain, official marks never stretched or
   cropped) and the name + country hold a consistent centred text block
   beneath.

   Grid: twice as many tracks as columns, every item spanning two, so a
   short final row can start on a HALF column and land centred — on a
   whole-column grid three items in four columns always leave the gap on
   the right (measured: 126px left / 0px right). Row gap 44 against
   column gap 36 keeps vertical air at 1.2x horizontal; the previous
   64/40 pairing (1.6x) split the grid into separate horizontal bands. */
.cs-inst-field { position: relative; margin-top: var(--space-10); }
.cs-inst-canvas {
  position: absolute; inset: -28px -16px; width: calc(100% + 32px); height: calc(100% + 56px);
  pointer-events: none; z-index: 0;
  mask-image: radial-gradient(120% 100% at 50% 50%, #000 55%, transparent 100%);
  -webkit-mask-image: radial-gradient(120% 100% at 50% 50%, #000 55%, transparent 100%);
}
.cs-inst-grid {
  position: relative; z-index: 1;
  display: grid; grid-template-columns: repeat(8, 1fr);
  column-gap: 36px; row-gap: 44px;
}
/* Collaborations has 5 entries: 4+1 read as a stray last card, so this
   list runs at 3 visual columns instead of Exchange's 4 — 3 over 2,
   centred by the same half-track math. Exchange is untouched. */
.cs-inst-grid--collab { grid-template-columns: repeat(6, 1fr); }
.cs-inst { min-width: 0; grid-column-end: span 2; text-align: center; }
.cs-inst-logo-stage { height: 62px; display: flex; align-items: center; justify-content: center; margin-bottom: 18px; }
.cs-inst-logo { max-height: 60px; max-width: 92px; width: auto; height: auto; object-fit: contain; }
.cs-inst-name {
  /* Regular weight at a magic 16.5px was the one serif label on the page not
     pulling from the shared scale, and Source Serif 4 at 400 reads pale when
     centred with no container around it. Every other serif "name" role on
     the site — h2/h3 titles, .cs-story-title, .display — sits at
     weight-medium; matching that plus the shared text-md token and a touch
     of negative tracking is what the rest of the page already agrees on. */
  display: block; font-family: var(--font-serif); font-weight: var(--weight-medium);
  font-size: var(--text-md); line-height: 1.3; letter-spacing: var(--tracking-tight);
  color: var(--text-strong); overflow-wrap: break-word; min-height: 2.6em;
}
a.cs-inst-name { transition: opacity var(--dur-fast) var(--ease-out); }
a.cs-inst-name:hover { opacity: .62; color: var(--text-strong); }
.cs-inst-country {
  display: block; margin-top: 8px; font-family: var(--font-sans);
  font-size: 11px; letter-spacing: .14em; text-transform: uppercase;
  color: var(--text-faint); font-weight: var(--weight-medium);
}
@media (prefers-reduced-motion: reduce) { .cs-inst-canvas { display: none; } }

/* ── The single atmosphere change ────────────────────────
   One transition on the whole page: warm ivory dissolving into the cool
   field. A gradient band rather than a rule, so it is a change of air and
   not a new section starting. */
.cs-shift { height: 96px; background: linear-gradient(180deg, #FDF6EE 0%, var(--slate-50) 100%); }

/* ── Work built together ─────────────────────────────────── */
.cs-work { padding: var(--space-16) 0 var(--space-20); }
.cs-work-inner { max-width: var(--container-base); margin: 0 auto; padding: 0 var(--gutter); }
.cs-work-head { display: grid; grid-template-columns: minmax(0, 38%) minmax(0, 62%); gap: var(--space-10); align-items: end; }
.cs-work-head h2 {
  font-family: var(--font-serif); font-weight: var(--weight-medium);
  font-size: var(--fs-section-title); line-height: 1.06;
  letter-spacing: var(--tracking-tight); color: var(--text-strong); margin-top: 12px;
}
.cs-work-lede { font-size: clamp(1rem, .93rem + .35vw, 1.2rem); line-height: 1.6; color: var(--text-muted); max-width: 52ch; }

.cs-stories { margin-top: var(--space-16); display: flex; flex-direction: column; gap: var(--space-16); }
.cs-story { border-top: 1px solid var(--border-subtle); padding-top: var(--space-10); }
.cs-story-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--space-12); align-items: start; }
/* The lead story carries slightly more weight — but it is a proportion,
   not a different component. */
.cs-story--lead .cs-story-grid { grid-template-columns: minmax(0, 1.08fr) minmax(0, .92fr); }
/* Alternate which side the image sits on, moderately. */
.cs-story--flip .cs-story-media { order: 2; }
/* With no photograph the block becomes a typographic composition: one
   measured column and air. No generic avatar is ever drawn. */
.cs-story--noimage .cs-story-grid { grid-template-columns: minmax(0, 1fr); }
.cs-story--noimage .cs-story-body { max-width: 62ch; }

.cs-story-media { margin: 0; }
.cs-story-media img { width: 100%; height: auto; border-radius: var(--radius-lg); background: var(--slate-100); }
.cs-story-caption { margin-top: 10px; font-family: var(--font-sans); font-style: italic; font-size: 12.5px; line-height: 1.5; color: var(--text-muted); }

.cs-story-title {
  font-family: var(--font-serif); font-weight: var(--weight-medium);
  font-size: clamp(1.4rem, 1.05rem + 1vw, 1.85rem); line-height: 1.15;
  letter-spacing: var(--tracking-tight); color: var(--text-strong); margin: 0;
}
.cs-story--lead .cs-story-title { font-size: clamp(1.55rem, 1.1rem + 1.4vw, 2.15rem); }
.cs-story-person {
  margin-top: 14px; font-family: var(--font-sans); font-size: 11.5px;
  letter-spacing: .1em; text-transform: uppercase; color: var(--text-muted);
  font-weight: var(--weight-semibold); line-height: 1.6;
}
.cs-story-body p.cs-story-para { margin-top: 16px; font-size: 16px; line-height: 1.7; color: var(--text-body); max-width: 58ch; }
.cs-pubs { margin-top: var(--space-8); border-top: 1px solid var(--border-subtle); }
.cs-pub { padding: 12px 0; border-bottom: 1px solid var(--border-subtle); font-size: 14px; line-height: 1.55; }
.cs-pub-title { color: var(--text-strong); font-weight: var(--weight-semibold); }
a.cs-pub-title { color: var(--blue-600); }
a.cs-pub-title:hover { color: var(--text-link-hover); }
.cs-pub-meta { display: block; margin-top: 4px; font-size: 13px; color: var(--text-muted); }
.cs-pub-meta em { font-family: var(--font-serif); font-style: italic; }
.cs-pub-doi { color: var(--text-faint); }

/* ── Entrance ────────────────────────────────────────────
   A single quiet fade-and-rise, never a reason to read the page. */
.cs-reveal { opacity: 0; transform: translateY(16px); transition: opacity .7s var(--ease-out), transform .7s var(--ease-out); }
.cs-reveal.is-in { opacity: 1; transform: none; }
@media (prefers-reduced-motion: reduce) {
  .cs-reveal { opacity: 1; transform: none; transition: none; }
}
/* If JavaScript never runs, nothing may stay invisible. */
.no-js .cs-reveal { opacity: 1; transform: none; }

/* ── Responsive ──────────────────────────────────────────── */
@media (max-width: 1024px) {
  .cs-hero-inner { grid-template-columns: minmax(0, 46%) minmax(0, 54%); }
  /* Tablet keeps the full field; the renderer's own copy-guard moves
     with the narrower text column, so nothing has to shift here. */
  .cs-wave-field { right: -18%; }
}
@media (max-width: 900px) {
  .cs-wider-grid, .cs-work-head { grid-template-columns: 1fr; gap: var(--space-5); align-items: start; }
  .cs-story-grid, .cs-story--lead .cs-story-grid { grid-template-columns: 1fr; gap: var(--space-8); }
  .cs-story--flip .cs-story-media { order: 0; }
}
@media (max-width: 780px) {
  /* Hero copy first, ripples behind it in the lower-right where no text sits. */
  .cs-hero { min-height: clamp(380px, 52vh, 460px); align-items: flex-start; }
  .cs-hero-inner { grid-template-columns: 1fr; }
  .cs-hero-copy { max-width: none; }
  .cs-hero-lede { max-width: 38ch; }
  /* The phone is not a crop of the desktop composition: the plane sits
     lower and further right, the renderer drops to ~3,200 particles,
     lowers the amplitude and lets the lower band carry the wave — so
     the copy sits on clean ivory and the ripple still reads. */
  .cs-wave-field {
    top: auto; bottom: -4%; left: 0; right: -26%; height: 104%;
    transform: translateY(var(--cs-shift, 0px));
  }

  .cs-mode { padding: var(--space-8) 0 var(--space-6); }
  .cs-mode-head { grid-template-columns: 1fr; gap: var(--space-4); }
  /* Track count halves with the columns the design targets (4 then 2),
     never auto-fill: auto-fill picked its own count from raw pixel width
     and once ignored the span-2 items, which broke last-row centring. */
  .cs-inst-grid { grid-template-columns: repeat(6, 1fr); column-gap: var(--space-5); row-gap: var(--space-8); }
  .cs-modes { padding-bottom: var(--space-12); }
  .cs-work { padding: var(--space-12) 0 var(--space-16); }
  .cs-stories { gap: var(--space-12); }
}
@media (max-width: 600px) {
  .cs-inst-grid { grid-template-columns: repeat(4, 1fr); }
}
@media (max-width: 420px) {
  .cs-inst-grid { grid-template-columns: repeat(2, 1fr); }
}
</style>

<main>

  <!-- ═══ Chapter 1 — one warm field: opening, the wider lab, the two modes ═══ -->

        </div>

       Vinicius: "a parte das historias fica para depois, vamos preparar para

  <div class="cs-shift" aria-hidden="true"></div>

            <p class="eyebrow cs-eyebrow">Selected stories</p>

<script src="assets/js/data/connected-science.js"></script>
<script src="assets/js/shared.js"></script>
<script src="assets/js/cs-wave-field.js?v=3" defer></script>
<script>
(function () {
  'use strict';
  var D = window.connectedScienceData || {};

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  /* ── Institutions ──────────────────────────────────────────
     Name (or logo, when one is supplied) plus country. Nothing else:
     no status, no counts, no per-institution description. */

  /* Optical heights arrive in `h` as bounding-box-area values (raw crest
     pixels), which range far wider than is calm on a page — 38.6 to 64 in
     this set. Clamping would flatten the extremes onto two values; a
     linear remap into [46,60] keeps every crest's rank and relative
     weight, just compressed. Only runs when at least one entry has `h`. */
  function bandHeights(list) {
    var hs = (list || []).map(function (i) { return i.h; }).filter(function (h) { return typeof h === 'number'; });
    if (!hs.length) return function (i) { return i.h || 40; };
    var lo = Math.min.apply(null, hs), hi = Math.max.apply(null, hs);
    return function (i) {
      if (typeof i.h !== 'number') return 40;
      if (hi === lo) return 53;
      return 46 + (i.h - lo) / (hi - lo) * (60 - 46);
    };
  }

  function renderInstitutions(el, list) {
    if (!el) return;
    var band = bandHeights(list);
    el.innerHTML = (list || []).map(function (i) {
      /* the logo is an image ABOVE the name, never a replacement for it:
         the name stays real text for search, screen readers and the
         no-logo fallback */
      var logo = i.logo
        ? '<div class="cs-inst-logo-stage"><img class="cs-inst-logo" style="height:' + band(i).toFixed(1) +
          'px" src="' + esc(i.logo) + '" alt="" loading="lazy"></div>'
        : '';
      var name = i.url
        ? '<a class="cs-inst-name" href="' + esc(i.url) + '" target="_blank" rel="noopener noreferrer">' + esc(i.institutionName) + '</a>'
        : '<span class="cs-inst-name">' + esc(i.institutionName) + '</span>';
      return '<li class="cs-inst">' + logo + name +
             '<span class="cs-inst-country">' + esc(i.country) + '</span></li>';
    }).join('');
  }

  /* Centre a short final row. Tracks T = 2·columns, every item spans 2; for
     n items in the last row the start track leaving equal margins is
     s = C-n+1, since leading = s-1 and trailing = T-(s+2n-1) are equal
     exactly there. Works for any parity of C-n — the reason for the
     half-track grid instead of a plain N-column one. */
  function centreLastRow(grid) {
    if (!grid) return;
    var items = [].slice.call(grid.children);
    items.forEach(function (i) { i.style.gridColumnStart = ''; });
    var cols = getComputedStyle(grid).gridTemplateColumns.split(' ').length / 2;
    var n = items.length % cols;
    if (!n) return;
    items[items.length - n].style.gridColumnStart = cols - n + 1;
  }

  function setText(id, txt) { var e = document.getElementById(id); if (e && txt) e.textContent = txt; }

  setText('cs-exchange-lead', D.exchangeLead);
  setText('cs-collab-lead',   D.collaborationsLead);
  setText('cs-work-lede',     D.storiesLead);
  renderInstitutions(document.getElementById('cs-exchange-list'), D.exchangeInstitutions);
  renderInstitutions(document.getElementById('cs-collab-list'),   D.collaborationInstitutions);

  var instGrids = [].slice.call(document.querySelectorAll('.cs-inst-grid'));
  var reflowInstGrids = function () { instGrids.forEach(centreLastRow); };
  reflowInstGrids();
  addEventListener('resize', reflowInstGrids);

  /* ── Institution field: a quiet copy of the hero's wave engine ──────
     Two fronts leave opposite edges and meet at centre, at low contrast,
     purely as ambient motion behind the grid. The crests themselves are
     NEVER touched by it — a version that lifted each crest a few pixels
     as its front passed read as bouncing logos, the wrong register for
     other institutions' marks. Motion lives only in the field. */
  /* This used to be a GAMMA-sharpened threshold field: dots sat invisible
     below a<0.012 and popped fully in once the front swept past, an
     on/off flicker close under the logos. Reported as making people
     dizzy. The hero's field never does that — every particle carries its
     OWN faint resting alpha (alpha0, set once) and the wave only ever
     LIFTS that baseline; nothing is born from zero or snaps off. This is
     the same principle, ported down to a much lower ceiling: peak
     opacity here is ~0.20 against the hero's ~0.5+, and the cycle is
     slower, because at arm's length behind small crests even the hero's
     own intensity would be too much. */
  /* Debug: append ?instDebug=1 to expose window.csInstDebug[i] = {draw,
     build, pts, force} per field, so the engine can be probed and driven
     without depending on IntersectionObserver/rAF actually firing (both
     are throttled or fully paused on a backgrounded/automated tab — see
     the loading="lazy" false-positive precedent elsewhere in this repo). */
  var INST_DEBUG = false;
  try { INST_DEBUG = new URLSearchParams(location.search).get('instDebug') === '1'; } catch (e) { INST_DEBUG = false; }
  if (INST_DEBUG) window.csInstDebug = [];

  function initInstField(field) {
    var cv = field.querySelector('.cs-inst-canvas');
    if (!cv || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var ctx = cv.getContext('2d');
    var smooth = function (a, b, x) { var t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
    var CYCLE = 17.0, FADE = 2.4, STEP = 16, BASE_LO = 0.035, BASE_HI = 0.10, LIFT = 0.85, PEAK = 0.20;
    var W = 0, H = 0, dpr = 1, pts = [], A, B, lam, speed, running = false, t0 = performance.now();

    function build() {
      var r = field.getBoundingClientRect();
      W = Math.max(1, Math.round(r.width + 24)); H = Math.max(1, Math.round(r.height + 48));
      dpr = Math.min(1.5, devicePixelRatio || 1);
      cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      A = { x: -W * 0.04, y: H * 0.5 }; B = { x: W * 1.04, y: H * 0.5 };
      lam = W * 0.30;
      speed = (W * 0.54) / (CYCLE * 0.52); // both fronts meet at centre at the same instant — derived, not chosen
      var s = 1, rnd = function () { s = (s * 1103515245 + 12345) & 0x7fffffff; return s / 0x7fffffff; };
      pts = [];
      for (var y = 6; y < H; y += STEP)
        for (var x = 6; x < W; x += STEP)
          pts.push({
            x: x + (rnd() - .5) * STEP * 0.30, y: y + (rnd() - .5) * STEP * 0.30,
            base: BASE_LO + rnd() * (BASE_HI - BASE_LO),      /* always faintly present, like the hero's sand */
            size: 1.5 + rnd() * 1.3
          });
      pts.forEach(function (p) { p.rA = Math.hypot(p.x - A.x, p.y - A.y); p.rB = Math.hypot(p.x - B.x, p.y - B.y); });
    }
    function prof(q) {
      if (q < -0.35 || q > 3.0) return 0;
      return smooth(-0.35, 0, q) * (1 - smooth(2.25, 3.0, q)) * Math.exp(-0.48 * Math.max(q, 0)) * Math.cos(6.28318 * q);
    }
    function draw(T) {
      var front = speed * T, release = 1 - smooth(CYCLE - FADE, CYCLE - 0.15, T);
      ctx.clearRect(0, 0, W, H);
      for (var i = 0; i < pts.length; i++) {
        var p = pts[i], z = prof((front - p.rA) / lam) + prof((front - p.rB) / lam);
        /* linear, not gamma-sharpened: a gentle lift on the resting alpha,
           never a jump from nothing. Crests brighten, troughs barely dim. */
        var a = p.base * (1 + LIFT * Math.max(0, z)) * release;
        if (a > PEAK) a = PEAK;
        if (a < 0.006) continue;
        var both = (front - p.rA) > 0 && (front - p.rB) > 0 && z > 0.80;
        ctx.fillStyle = both ? 'rgba(244,148,47,' + (a * 0.75) + ')' : 'rgba(62,111,168,' + a + ')';
        ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
      }
    }
    function frame(now) {
      if (!running) return;
      draw(((now - t0) / 1000) % CYCLE);
      requestAnimationFrame(frame);
    }
    new ResizeObserver(build).observe(field);
    new IntersectionObserver(function (es) {
      es.forEach(function (e) {
        if (e.isIntersecting && !running) { running = true; t0 = performance.now(); requestAnimationFrame(frame); }
        else if (!e.isIntersecting) running = false;
      });
    }, { threshold: 0.05 }).observe(field);
    build();

    if (INST_DEBUG) {
      window.csInstDebug.push({
        build: build, draw: draw, pts: function () { return pts; },
        dims: function () { return { W: W, H: H, lam: lam, speed: speed, A: A, B: B }; },
        /* Forces exactly one frame at age T, bypassing IO/rAF entirely. */
        force: function (T) { draw(T == null ? 0 : T); }
      });
    }
  }
  [].slice.call(document.querySelectorAll('.cs-inst-field')).forEach(initInstField);

  /* ── Stories ───────────────────────────────────────────────
     Editorial blocks, not a card grid. The first is proportionally larger;
     the image side alternates. A story with no photograph collapses to a
     single measured text column rather than borrowing a stock face. */
  function renderPubs(pubs) {
    if (!pubs || !pubs.length) return '';
    var rows = pubs.map(function (p) {
      var href = p.externalURL || (p.doi ? 'https://doi.org/' + p.doi : '');
      var title = esc(p.publicationTitle);
      var titleHtml = href
        ? '<a class="cs-pub-title" href="' + esc(href) + '" target="_blank" rel="noopener noreferrer">' + title + '</a>'
        : '<span class="cs-pub-title">' + title + '</span>';
      var bits = [];
      if (p.journal) bits.push('<em>' + esc(p.journal) + '</em>');
      if (p.year)    bits.push(esc(p.year));
      var meta = bits.join(' · ');
      if (p.doi) meta += (meta ? ' · ' : '') + '<span class="cs-pub-doi">doi:' + esc(p.doi) + '</span>';
      return '<li class="cs-pub">' + titleHtml +
             (meta ? '<span class="cs-pub-meta">' + meta + '</span>' : '') + '</li>';
    }).join('');
    return '<ul class="cs-pubs">' + rows + '</ul>';
  }

  function renderStory(s, index) {
    var hasImage = !!s.portrait;
    var cls = ['cs-story', 'cs-reveal'];
    if (index === 0) cls.push('cs-story--lead');
    if (!hasImage) cls.push('cs-story--noimage');
    else if (index % 2 === 1) cls.push('cs-story--flip');

    var who = [s.collaboratorName, s.collaboratorRole, s.institution, s.country]
      .filter(Boolean).map(esc).join(' · ');

    var paras = [s.relationshipOrigin, s.workBuilt, s.publicationOutcome, s.whatContinues]
      .filter(Boolean)
      .map(function (t) { return '<p class="cs-story-para">' + esc(t) + '</p>'; })
      .join('');

    var media = hasImage
      ? '<figure class="cs-story-media"><img src="' + esc(s.portrait) + '" alt="' + esc(s.imageAlt || '') + '" loading="lazy" decoding="async" width="1200" height="900">' +
        (s.caption ? '<figcaption class="cs-story-caption">' + esc(s.caption) + '</figcaption>' : '') +
        '</figure>'
      : '';

    return '<article class="' + cls.join(' ') + '"' + (s.id ? ' id="' + esc(s.id) + '"' : '') + '>' +
             '<div class="cs-story-grid">' + media +
               '<div class="cs-story-body">' +
                 '<h3 class="cs-story-title">' + esc(s.title) + '</h3>' +
                 (who ? '<p class="cs-story-person">' + who + '</p>' : '') +
                 paras + renderPubs(s.publications) +
               '</div>' +
             '</div>' +
           '</article>';
  }

  var wrap = document.getElementById('cs-stories');
  if (wrap) wrap.innerHTML = (D.stories || []).map(renderStory).join('');

  /* ── Entrance + ripple idling ──────────────────────────────
     Both are progressive enhancements: without IntersectionObserver the
     content is simply visible and the field simply runs. */
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var items = document.querySelectorAll('.cs-reveal');

  if (!('IntersectionObserver' in window) || reduce) {
    Array.prototype.forEach.call(items, function (el) { el.classList.add('is-in'); });
  } else {
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e, i) {
        if (!e.isIntersecting) return;
        e.target.style.transitionDelay = (i * 70) + 'ms';
        e.target.classList.add('is-in');
        io.unobserve(e.target);
      });
    }, { rootMargin: '0px 0px -12% 0px', threshold: 0.05 });
    Array.prototype.forEach.call(items, function (el) { io.observe(el); });

    /* Fail-safe. IntersectionObserver callbacks ride the rendering lifecycle,
       which Chrome suspends while a tab is in the background — a page opened
       in a background tab can therefore sit at opacity 0 with no callback
       pending. Observed exactly that during testing. After 2.5s the entrance
       has stopped being an entrance anyway, so reveal everything: the
       fail-safe state has to be visible, never blank. */
    setTimeout(function () {
      Array.prototype.forEach.call(items, function (el) {
        /* transition:none, not just the class: with the lifecycle suspended a
           pending transition never starts and the element stays painted at 0. */
        if (!el.classList.contains('is-in')) { el.style.transition = 'none'; el.classList.add('is-in'); }
      });
    }, 2500);
  }

  var art = document.querySelector('.cs-wave-field');
  var heroEl = document.querySelector('.cs-hero');
  var heroOnScreen = true;

  if (art && 'IntersectionObserver' in window) {
    new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        heroOnScreen = e.isIntersecting;
        art.classList.toggle('is-idle', !e.isIntersecting);
      });
    }, { threshold: 0 }).observe(art);
  }

  /* Scroll continuity — deliberately almost nothing.
     The field lags the page by at most 26px and loses a third of its weight,
     so its lower arcs trail down into "The wider lab" instead of ending at the
     hero's edge. That is the whole point: one warm chapter, not a hero and
     then a section. Anything larger than this becomes parallax theatre.
     Reads are rAF-batched and stop once the hero leaves the viewport. */
  if (art && heroEl && !reduce) {
    var ticking = false;
    var apply = function () {
      ticking = false;
      if (!heroOnScreen) return;
      var s = Math.min(1, Math.max(0, window.pageYOffset / Math.max(1, heroEl.offsetHeight)));
      art.style.setProperty('--cs-shift', (s * 16).toFixed(1) + 'px');
      art.style.setProperty('--cs-fade', (1 - s * 0.30).toFixed(3));
    };
    window.addEventListener('scroll', function () {
      if (!ticking) { ticking = true; requestAnimationFrame(apply); }
    }, { passive: true });
    apply();
  }
})();
</script>
</body>
</html>

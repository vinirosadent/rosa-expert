<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>News — Vinicius Rosa · NUS Faculty of Dentistry</title>
<meta name="description" content="Press coverage, awards, appointments and institutional work across A/P Rosa's research.">
<link rel="canonical" href="https://rosa.expert/news.html">
<meta property="og:type" content="website">
<meta property="og:url" content="https://rosa.expert/news.html">
<meta property="og:title" content="News | Vinicius Rosa">
<meta property="og:description" content="Press coverage, awards, appointments and institutional work across A/P Rosa's research.">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/components.css">
<style>
/* ============================================================
   News — estilos da página (prefixo nw-)
   Estrutura, tipografia e cor vêm de tokens.css / components.css.
   Aqui só existe o que é desta página: o hero da matéria principal.

   A ideia, em uma frase: a fotografia se desfaz em ivory da direita
   para a esquerda, e é no papel já limpo que a manchete se apoia.
   Nada de card, nada de moldura.

   A nuvem de pontos que existia nesta faixa foi REMOVIDA a pedido em
   2026-08-04 — não era o que a página queria dizer. O véu continua
   sendo o mesmo: ele existe para a tipografia, não para o campo. Se um
   dia voltar, o renderer está em git (commit 51aadba,
   assets/js/news-apparition.js).
   ============================================================ */

/* O ivory é o MESMO da premissa da home e de Connected Science
   (--premise-ivory #FDF6EE). Reusar o valor é o que faz a news ler como
   parte do site em vez de um terceiro tom quente. */
.nw { --nw-ivory: #FDF6EE; background: var(--nw-ivory); }
body { background: #FDF6EE; }   /* a emenda com o footer não pode mostrar o near-white do body */

.nw-eyebrow { letter-spacing: .2em; }

/* ── Hero ────────────────────────────────────────────────────
   Não é tela cheia: a altura é limitada para que "Also this year" já
   esteja começando a aparecer a 1440x900. O visitante não deve rolar e
   encontrar apenas outro título grande. */
.nw-hero {
  position: relative; overflow: hidden;
  /* A faixa da foto para no MESMO 1180 do header (.header-inner) e do
     "Also this year". Full-bleed custava duas coisas, medidas a 2560px:
     a foto passava 754px do texto do nav — a margem vazia da esquerda
     contra foto sangrando na direita — e o object-fit:cover jogava fora
     61% da ALTURA da imagem, que era o que decapitava o dente. Preso em
     1180 sobram 84% da imagem (90% a 1920, 84% a 1440). */
  max-width: var(--container-base); margin: 0 auto;
  min-height: clamp(460px, 62vh, 600px);
  display: flex; align-items: center;
}
.nw-hero-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 22%; }
/* O véu: vertical (para a foto não bater no header nem no conteúdo) +
   96° (o que dissolve a imagem para a esquerda). Os stops do 96° são os
   mesmos da .premise-scrim da home. */
.nw-hero-scrim {
  position: absolute; inset: 0; z-index: 2; pointer-events: none;
  background:
    linear-gradient(180deg, var(--nw-ivory) 0%, rgba(253,246,238,0) 16%, rgba(253,246,238,0) 84%, var(--nw-ivory) 100%),
    linear-gradient(96deg, var(--nw-ivory) 0%, rgba(253,246,238,.96) 27%, rgba(253,246,238,.74) 42%, rgba(253,246,238,.22) 58%, rgba(253,246,238,0) 72%);
}
/* Acima de 1180 o container corta a faixa e nasce uma borda vertical dura
   do lado direito — a foto é quase preta ali, então o corte grita. Ela
   morre em ivory por feather, nunca por corte: é a mesma regra do
   CLAUDE.md para imagem que "sangra". 20% e não 14%: a 14% a borda escura
   ainda lia numa simulação do recorte; e 20% é o teto, porque o dente
   termina em 84% da faixa e um feather maior comeria o dente.
   Abaixo de 1180 a faixa vai até a borda da tela e não há emenda a
   esconder — por isso isto vive numa min-width, não na regra base. */
@media (min-width: 1180px) {
  .nw-hero-scrim {
    background:
      linear-gradient(180deg, var(--nw-ivory) 0%, rgba(253,246,238,0) 16%, rgba(253,246,238,0) 84%, var(--nw-ivory) 100%),
      linear-gradient(270deg, var(--nw-ivory) 0%, rgba(253,246,238,0) 20%),
      linear-gradient(96deg, var(--nw-ivory) 0%, rgba(253,246,238,.96) 27%, rgba(253,246,238,.74) 42%, rgba(253,246,238,.22) 58%, rgba(253,246,238,0) 72%);
  }
}
.nw-hero-inner {
  position: relative; z-index: 3; width: 100%;
  max-width: var(--container-base); margin: 0 auto; padding: 0 var(--gutter);
}
.nw-hero-copy { max-width: 30rem; }
/* Sem fotografia a manchete fica sozinha e pode respirar mais. */
.nw-hero--nopic { min-height: clamp(400px, 52vh, 520px); }
.nw-hero--nopic .nw-hero-copy { max-width: 34rem; }

.nw-hero h1 {
  font-family: var(--font-serif); font-weight: var(--weight-medium);
  font-size: var(--fs-page-title);      /* mesma rampa de Who / To read / Connected Science */
  line-height: 1.04; letter-spacing: var(--tracking-tight);
  color: var(--text-strong); margin: 16px 0 0;
}
.nw-dek { margin-top: 18px; font-size: clamp(1rem, .93rem + .35vw, 1.15rem); line-height: 1.62; color: var(--text-body); max-width: 38ch; }
.nw-kicker {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 24px;
  font-family: var(--font-sans); font-size: 11.5px; font-weight: var(--weight-bold);
  letter-spacing: .12em; text-transform: uppercase;
}
.nw-kicker-src { color: var(--blue-700); }
.nw-kicker-dot { width: 3px; height: 3px; border-radius: 50%; background: var(--border-strong); flex: none; }
.nw-kicker-faint { color: var(--text-faint); }
.nw-cta {
  display: inline-block; margin-top: 26px;
  font-size: 13.5px; font-weight: var(--weight-semibold); color: var(--blue-700);
  border-bottom: 1.5px solid var(--orange-500); padding-bottom: 4px;
}
a:hover .nw-cta, .nw-cta:hover { color: var(--orange-600); }

/* ── Also this year ──────────────────────────────────────────
   Registro, não grade. Duas matérias com placa (as que têm fotografia
   que vale) e o resto em filetes de duas colunas. */
/* Fecho curto embaixo: o arquivo dos anos anteriores corre logo em
   seguida, e o margin-top do primeiro .nw-year já dá a separação. */
.nw-also { max-width: var(--container-base); margin: 0 auto; padding: var(--space-12) var(--gutter) var(--space-2); }
.nw-also-head { display: flex; align-items: baseline; gap: var(--space-6); border-top: 1px solid var(--border-subtle); padding-top: var(--space-5); }
.nw-also-title { font-family: var(--font-serif); font-weight: var(--weight-medium); font-size: 26px; color: var(--text-strong); }
.nw-also-count { font-size: 13px; color: var(--text-muted); margin-left: auto; }

.nw-feature { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: var(--space-8); align-items: center; padding: var(--space-8) 0; border-bottom: 1px solid var(--border-subtle); text-decoration: none; }
.nw-feature-media { position: relative; overflow: hidden; aspect-ratio: 5 / 3; }
.nw-feature-media img { width: 100%; height: 100%; object-fit: cover; }
/* A mesma dissolução do hero, em miniatura e no eixo curto: a placa não
   tem borda do lado que encosta no texto. */
.nw-feature-veil { position: absolute; inset: 0; background: linear-gradient(84deg, rgba(253,246,238,.72) 0%, rgba(253,246,238,.10) 62%, rgba(253,246,238,0) 100%); }
.nw-feature-src { font-family: var(--font-sans); font-size: 11px; font-weight: var(--weight-bold); letter-spacing: .12em; text-transform: uppercase; color: var(--text-muted); }
.nw-feature-src--lead { color: var(--orange-600); }
.nw-feature-title { font-family: var(--font-serif); font-weight: var(--weight-medium); font-size: 27px; line-height: 1.18; letter-spacing: var(--tracking-tight); color: var(--text-strong); margin-top: 12px; }
.nw-feature-dek { margin-top: 12px; font-size: 15.5px; line-height: 1.65; color: var(--text-muted); max-width: 56ch; }

.nw-rows { display: grid; grid-template-columns: 1fr 1fr; column-gap: var(--space-12); margin-top: var(--space-3); }
.nw-row { display: flex; gap: 18px; align-items: baseline; padding: var(--space-4) 0; border-bottom: 1px solid var(--border-subtle); text-decoration: none; }
.nw-row-date { flex: none; width: 74px; font-size: 12px; color: var(--text-faint); }
.nw-row-title { font-family: var(--font-serif); font-size: 18px; line-height: 1.35; color: var(--text-strong); }
.nw-row:hover .nw-row-title { color: var(--blue-600); }

/* ── Arquivo por ano ─────────────────────────────────────────
   Mesmos filetes, agrupados, correndo direto abaixo do ano corrente —
   sem link de "earlier years". O ano é um numeral serif discreto: a
   lista continua sendo o objeto, o ano é só onde ela dobra. */
.nw-archive { max-width: var(--container-base); margin: 0 auto; padding: 0 var(--gutter) var(--space-16); }
.nw-year { display: flex; align-items: baseline; gap: var(--space-5); margin-top: var(--space-10); }
.nw-year-label { font-family: var(--font-serif); font-weight: var(--weight-medium); font-size: 24px; color: var(--blue-700); }
.nw-year-count { font-size: 12.5px; color: var(--text-faint); }

/* ── Entrada ─────────────────────────────────────────────────
   Um fade-and-rise curto, igual ao de Connected Science, e nada mais. */
.nw-reveal { opacity: 0; transform: translateY(16px); transition: opacity .7s var(--ease-out), transform .7s var(--ease-out); }
.nw-reveal.is-in { opacity: 1; transform: none; }
.no-js .nw-reveal { opacity: 1; transform: none; }
@media (prefers-reduced-motion: reduce) { .nw-reveal { opacity: 1; transform: none; transition: none; } }

/* ── Responsivo ──────────────────────────────────────────────
   No telefone não existe "direita": a dissolução vira vertical — a foto
   entra em cima e se apaga para baixo, com a manchete embaixo dela. */
@media (max-width: 900px) {
  .nw-feature { grid-template-columns: 1fr; gap: var(--space-5); }
  .nw-rows { grid-template-columns: 1fr; }
}
@media (max-width: 780px) {
  .nw-hero { min-height: 0; display: block; padding-top: 46vw; }
  .nw-hero-img { height: 62%; object-position: center 18%; }
  .nw-hero-scrim {
    background: linear-gradient(180deg, rgba(253,246,238,.30) 0%, rgba(253,246,238,.10) 16%, rgba(253,246,238,.62) 40%, var(--nw-ivory) 62%);
  }
  .nw-hero-inner { padding-bottom: var(--space-10); }
  .nw-hero-copy { max-width: none; }
  .nw-dek { max-width: 40ch; }
  .nw-hero--nopic { padding-top: var(--space-12); }
}
</style>
</head>
<body>
<script>document.documentElement.classList.remove('no-js');</script>
<div id="app">
<main class="nw">

  <!-- Hero: a matéria principal. Preenchido pelo script porque a fonte
       é assets/js/data/news.js — nada de manchete duplicada em HTML. -->
  <section class="nw-hero" id="nw-hero" aria-labelledby="nw-h1">
    <img class="nw-hero-img" id="nw-hero-img" alt="" decoding="async">
    <div class="nw-hero-scrim" aria-hidden="true"></div>
    <div class="nw-hero-inner">
      <div class="nw-hero-copy">
        <p class="eyebrow nw-eyebrow">Newsroom · Lead story</p>
        <h1 id="nw-h1"></h1>
        <p class="nw-dek" id="nw-dek"></p>
        <div class="nw-kicker" id="nw-kicker"></div>
        <a href="#" id="nw-cta"><span class="nw-cta">Read the story →</span></a>
      </div>
    </div>
  </section>

  <section class="nw-also nw-reveal" aria-labelledby="nw-also-h">
    <div class="nw-also-head">
      <h2 class="nw-also-title" id="nw-also-h">Also this year</h2>
      <span class="nw-also-count" id="nw-also-count"></span>
    </div>
    <div id="nw-features"></div>
    <div class="nw-rows" id="nw-rows"></div>
  </section>

  <!-- O arquivo corre direto, sem portão: a página não precisa "acabar"
       num clique. Todos os anos ficam visíveis de uma vez. -->
  <section class="nw-archive" id="nw-archive" aria-labelledby="nw-archive-h">
    <h2 class="nw-also-title" id="nw-archive-h" style="position:absolute;left:-9999px;">News archive</h2>
    <div id="nw-archive-body"></div>
  </section>

</main>
</div><!-- /app -->

<script src="assets/js/data/news.js"></script>
<script src="assets/js/shared.js"></script>
<script>
(function () {
  'use strict';
  var ALL = (window.NEWS || []).slice();
  if (!ALL.length) return;

  function href(item) { return 'news/' + item.slug + '.html'; }
  function esc(s) { return String(s == null ? '' : s).replace(/&(?![a-z#0-9]+;)/gi, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

  /* Ordem e ano vêm de dateISO quando existe; sem ele, cai para o ano
     que estiver escrito em `date` (é o que 41 entradas antigas têm) e a
     ordem do array decide o resto. Entrada nova SEM dateISO é bug. */
  function year(item) {
    if (item.dateISO) return +item.dateISO.slice(0, 4);
    var m = String(item.date || '').match(/(\d{4})/);
    return m ? +m[1] : 0;
  }
  function stamp(item) { return item.dateISO ? item.dateISO : year(item) + '-00-00'; }
  ALL.sort(function (a, b) { return stamp(b).localeCompare(stamp(a)); });

  var lead = ALL.filter(function (n) { return n.lead; })[0] || ALL[0];
  var rest = ALL.filter(function (n) { return n !== lead; });
  var newest = year(lead);
  var thisYear = rest.filter(function (n) { return year(n) === newest; });
  var older = rest.filter(function (n) { return year(n) !== newest; });

  /* ── Hero ── */
  var hero = document.getElementById('nw-hero');
  var img = document.getElementById('nw-hero-img');
  if (lead.image) {
    img.src = lead.image;
    img.alt = lead.imageAlt || '';
    if (lead.imageFocus) img.style.objectPosition = lead.imageFocus;
  } else {
    /* Estado degradado, previsto: sem foto o hero é só a manchete, numa
       coluna mais larga. Nenhuma imagem entra só para preencher. */
    hero.classList.add('nw-hero--nopic');
    img.remove();
    hero.querySelector('.nw-hero-scrim').remove();
  }
  document.getElementById('nw-h1').innerHTML = lead.headline;
  var dek = document.getElementById('nw-dek');
  if (lead.dek) dek.innerHTML = lead.dek; else dek.remove();
  document.getElementById('nw-kicker').innerHTML =
    '<span class="nw-kicker-src">' + lead.source + '</span>' +
    '<span class="nw-kicker-dot"></span>' +
    '<time class="nw-kicker-faint"' + (lead.dateISO ? ' datetime="' + lead.dateISO + '"' : '') + '>' + lead.date + '</time>' +
    (lead.readMinutes ? '<span class="nw-kicker-dot"></span><span class="nw-kicker-faint">' + lead.readMinutes + ' min read</span>' : '');
  document.getElementById('nw-cta').href = href(lead);

  /* ── Also this year: até duas placas + filetes ── */
  var withPic = thisYear.filter(function (n) { return n.image; }).slice(0, 2);
  document.getElementById('nw-features').innerHTML = withPic.map(function (n, i) {
    return '<a class="nw-feature" href="' + href(n) + '">' +
      '<div class="nw-feature-media"><img src="' + esc(n.image) + '" alt="' + esc(n.imageAlt || '') + '" loading="lazy" decoding="async">' +
      '<div class="nw-feature-veil" aria-hidden="true"></div></div>' +
      '<div><div class="nw-feature-src' + (i === 0 ? ' nw-feature-src--lead' : '') + '">' + n.source + ' · ' + n.date + '</div>' +
      '<div class="nw-feature-title">' + n.headline + '</div>' +
      (n.dek ? '<p class="nw-feature-dek">' + n.dek + '</p>' : '') +
      '</div></a>';
  }).join('');

  function rowHTML(n) {
    return '<a class="nw-row" href="' + href(n) + '">' +
      '<span class="nw-row-date">' + n.date + '</span>' +
      '<span class="nw-row-title">' + n.headline + '</span></a>';
  }
  var rows = thisYear.filter(function (n) { return withPic.indexOf(n) < 0; });
  document.getElementById('nw-rows').innerHTML = rows.map(rowHTML).join('');
  document.getElementById('nw-also-count').textContent =
    newest + ' · ' + thisYear.length + (thisYear.length === 1 ? ' entry' : ' entries');

  /* ── Arquivo ── */
  var years = [];
  older.forEach(function (n) { var y = year(n); if (years.indexOf(y) < 0) years.push(y); });
  document.getElementById('nw-archive-body').innerHTML = years.map(function (y) {
    var items = older.filter(function (n) { return year(n) === y; });
    return '<div class="nw-year"><span class="nw-year-label">' + y + '</span>' +
      '<span class="nw-year-count">' + items.length + (items.length === 1 ? ' entry' : ' entries') + '</span></div>' +
      '<div class="nw-rows">' + items.map(rowHTML).join('') + '</div>';
  }).join('');

  /* ── Entrada ──
     Progressive enhancement com fail-safe: callbacks de
     IntersectionObserver rodam no ciclo de renderização, que o navegador
     suspende em aba de fundo — uma página aberta em segundo plano ficaria
     em opacity 0 para sempre. Depois de 2,5s a entrada já não é entrada. */
  var items = document.querySelectorAll('.nw-reveal');
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!('IntersectionObserver' in window) || reduce) {
    Array.prototype.forEach.call(items, function (el) { el.classList.add('is-in'); });
  } else {
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (!e.isIntersecting) return;
        e.target.classList.add('is-in');
        io.unobserve(e.target);
      });
    }, { rootMargin: '0px 0px -12% 0px', threshold: 0.05 });
    Array.prototype.forEach.call(items, function (el) { io.observe(el); });
    setTimeout(function () {
      Array.prototype.forEach.call(items, function (el) {
        if (!el.classList.contains('is-in')) { el.style.transition = 'none'; el.classList.add('is-in'); }
      });
    }, 2500);
  }
})();
</script>
</body>
</html>
